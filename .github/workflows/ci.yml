name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate assets & site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Content gate (verify.py)
        run: python3 verify.py

      - name: Export agents (export-agents.py)
        run: python3 export-agents.py

      - name: Export platform packages (export-platforms.py)
        run: python3 export-platforms.py

      - name: Unit tests (unittest)
        run: python3 -m unittest discover -s tests

      - name: Site data drift check (build-site.py --check)
        run: python3 build-site.py --check
